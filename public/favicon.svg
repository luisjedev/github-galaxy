<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#202064"/>
      <stop offset="0.55" stop-color="#0b0d2b"/>
      <stop offset="1" stop-color="#050611"/>
    </radialGradient>
    <radialGradient id="sun" cx="38%" cy="32%" r="68%">
      <stop offset="0" stop-color="#fffbd1"/>
      <stop offset="0.28" stop-color="#ffd95a"/>
      <stop offset="0.7" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#f0442b"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#space)"/>
  <circle cx="12" cy="14" r="1.2" fill="#b7d8ff"/>
  <circle cx="51" cy="12" r="1" fill="#fff"/>
  <circle cx="55" cy="43" r="1.3" fill="#9fc8ff"/>
  <circle cx="15" cy="51" r="0.8" fill="#fff"/>

  <ellipse cx="32" cy="32" rx="24" ry="11" fill="none" stroke="#8b7dff" stroke-width="2" opacity="0.8" transform="rotate(-20 32 32)"/>
  <circle cx="50.5" cy="22" r="3.2" fill="#74d9ff" stroke="#d9f7ff" stroke-width="1"/>

  <circle cx="32" cy="32" r="12" fill="#ff922b" opacity="0.32" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="9" fill="url(#sun)" filter="url(#glow)"/>
  <circle cx="29" cy="29" r="2" fill="#fff8b0" opacity="0.75"/>
</svg>
